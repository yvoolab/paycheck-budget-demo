<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE6">
<meta name="author" content="Yvoo">
<!--HOSTED_HEAD-->
<title>Paycheck Budget · Demo · Yvoo</title>
<style>
:root,[data-theme=light]{--bg:#F5EFE6;--panel:#FBF8F3;--ink:#2B2725;--mute:#6B625B;--line:#D9CFC2;--soft:#EFE6D8;--red:#9E2B25;--onred:#fff;--field:#fff}
[data-theme=white]{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#2B2725;--mute:#6B625B;--line:#E2DDD6;--soft:#F6F4F1;--red:#9E2B25;--onred:#fff;--field:#fff}
[data-theme=dark]{--bg:#1F1C1A;--panel:#282421;--ink:#EDE6DC;--mute:#A99F95;--line:#3D3733;--soft:#322D29;--red:#B8423A;--onred:#fff;--field:#1F1C1A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 10px}
header h1{font-family:Georgia,Cambria,serif;font-weight:600;font-size:26px;letter-spacing:.01em}
header small{color:var(--mute);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -16px 18px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:12px 9px;font:inherit;font-size:15px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.banner{border:1px solid var(--line);background:var(--soft);padding:12px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-bottom:16px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.big{font-family:Georgia,Cambria,serif;font-size:52px;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px}
.hint{color:var(--mute);font-size:13px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{color:var(--mute);font-size:13px}
.click{cursor:pointer}
.calc .row{padding:6px 0;font-size:15px}
.calc .row.total{font-weight:600;border-top:1px solid var(--ink)}
h2{font-family:Georgia,Cambria,serif;font-weight:600;font-size:21px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button.b{font:inherit;font-size:15px;padding:10px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.b.primary{background:var(--red);border-color:var(--red);color:var(--onred);font-weight:600}
button.b.small{font-size:13px;padding:5px 10px}
button.b.quiet{border-color:var(--line);color:var(--mute)}
.neg{font-style:italic}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:1px 6px;color:var(--mute);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--ink);flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;padding:7px 12px;border:0;background:transparent;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.bar{height:6px;background:var(--soft);margin-top:6px}.bar i{display:block;height:100%;background:var(--ink)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.modal{position:fixed;inset:0;background:rgba(20,18,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 18px 24px;border-top:2px solid var(--ink)}
@media(min-width:600px){.modal{align-items:center}.sheet{border:1px solid var(--line)}}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--mute)}
label.f input,label.f select,.grid input,.grid select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
label.c{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.err{color:var(--red);font-size:14px;margin-top:10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.chips button{font:inherit;font-size:15px;padding:14px 6px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.fab{position:fixed;right:16px;bottom:16px;z-index:10;font:inherit;font-size:16px;font-weight:600;padding:14px 20px;background:var(--red);color:var(--onred);border:0;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;font-size:14px;display:none;gap:14px;align-items:center}
#toast.on{display:flex}
#toast button{font:inherit;font-size:14px;background:none;border:0;color:var(--bg);text-decoration:underline;cursor:pointer}
.choice{display:block;width:100%;text-align:left;font:inherit;padding:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);margin-top:10px;cursor:pointer}
.choice.on{border:2px solid var(--ink)}
.choice b{display:block;font-size:16px}.choice span{font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.grid input,.grid select{margin-top:0;font-size:15px;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal div{min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;font-size:11px;line-height:1.3;overflow:hidden}
.cal .h{min-height:0;font-size:11px;color:var(--mute);text-align:center;background:var(--soft)}
.cal .d{font-weight:600;font-size:12px}
.cal .out{background:var(--soft);color:var(--mute)}
.cal .now{outline:2px solid var(--ink);outline-offset:-2px}
.cal i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .pay{font-weight:600}
footer{color:var(--mute);font-size:12px;margin-top:26px;line-height:1.6}
</style>
</head>

<header><h1>Paycheck Budget</h1><small>Yvoo</small></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="foot"></footer>
</div>

<div id="modal"></div>
